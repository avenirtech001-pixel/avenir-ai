<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AVENIR - Autonomous Web Runtime</title>
  <link rel="icon" type="image/jpeg" href="/avenir-icon.jpg">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cinzel", serif;
      background: #060709;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .hero-banner {
      width: 100%;
      max-width: 560px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
      margin-bottom: 24px;
      overflow: hidden;
      background: #000;
    }
    .hero-banner img {
      width: 100%;
      height: auto;
      display: block;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.12);
      color: #e6c673;
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #fff 0%, #e6c673 50%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      max-width: 520px;
      line-height: 1.6;
      margin: 0 0 24px;
      font-size: 14px;
    }
    .btn {
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #0b0d11;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(212, 175, 55, 0.45);
    }
    .metrics {
      display: flex;
      gap: 16px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: #0f131a;
      padding: 14px 22px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 120px;
    }
    .val {
      font-size: 22px;
      font-weight: bold;
      color: #e6c673;
    }
    .lbl {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="hero-banner">
    <img src="/avenir-logo.jpg" alt="AVENIR Logo Emblem">
  </div>
  <div class="badge">● AVENIR Autonomous Web Runtime</div>
  <h1>AVENIR AI</h1>
  <p>Institutional AI Engineering Studio powered by Gemini. Real-time synthesis across VS Code, Android Studio, MetaTrader 5, and Chromium Browser.</p>
  <button class="btn" onclick="triggerEvent()">DISPATCH TEST ASSERTION</button>
  <div class="metrics">
    <div class="card"><div class="val" id="clicks">0</div><div class="lbl">Events Dispatched</div></div>
    <div class="card"><div class="val">60 fps</div><div class="lbl">Vulkan Render</div></div>
    <div class="card"><div class="val">0</div><div class="lbl">DOM Exceptions</div></div>
  </div>
  <script>
    let count = 0;
    function triggerEvent() {
      count++;
      document.getElementById('clicks').innerText = count;
      console.log('[AVENIR Runtime] Event dispatched #' + count);
    }
  </script>
</body>
</html>
